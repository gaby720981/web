<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Panda de la Decepción</title>
    <style>
        /* --- RESET Y ESTILOS BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
        }

        .container {
            max-width: 620px;
            width: 100%;
            text-align: center;
            padding: 40px 30px;
            border: 2px solid #000000;
            background: #ffffff;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.06);
        }

        .container h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #000000;
        }

        .container .subtitle {
            font-size: 0.8rem;
            color: #666666;
            margin-bottom: 28px;
            border-top: 1px solid #dddddd;
            border-bottom: 1px solid #dddddd;
            padding: 10px 0;
            font-style: italic;
            letter-spacing: 0.3px;
        }

        /* --- BOTÓN --- */
        .btn-panda {
            display: inline-block;
            padding: 16px 24px;
            background: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            border: 2px solid #000000;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-bottom: 28px;
            width: 100%;
            max-width: 400px;
            box-shadow: 4px 4px 0 #000000;
        }

        .btn-panda:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 2px 2px 0 #000000;
            transform: translate(2px, 2px);
        }

        .btn-panda:active {
            transform: scale(0.96);
            box-shadow: none;
        }

        /* --- CAJA DE LA VERDAD --- */
        .truth-box {
            min-height: 120px;
            padding: 24px 20px;
            border: 1px solid #cccccc;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, border-color 0.2s;
        }

        .truth-box p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #000000;
            margin: 0;
            font-weight: 400;
            word-break: break-word;
            min-height: 60px;
        }

        .truth-box .placeholder {
            color: #aaaaaa;
            font-style: italic;
            font-size: 0.9rem;
        }

        /* Efecto visual mientras "escribe" */
        .truth-box.writing {
            border-color: #000000;
            background: #f0f0f0;
        }

        /* Cursor parpadeante al final del texto (opcional) */
        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #000000;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.6s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* --- CONTADOR --- */
        .counter {
            margin-top: 18px;
            font-size: 0.75rem;
            color: #888888;
            letter-spacing: 0.5px;
            border-top: 1px solid #eeeeee;
            padding-top: 16px;
            transition: color 0.3s;
        }

        .counter strong {
            color: #000000;
            font-weight: 700;
        }

        .counter.high {
            color: #333333;
        }

        .counter.high strong {
            color: #cc0000;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 480px) {
            .container {
                padding: 24px 16px;
            }
            .container h1 {
                font-size: 1.4rem;
            }
            .btn-panda {
                font-size: 0.8rem;
                padding: 14px 16px;
            }
            .truth-box p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>🐼 el panda de la decepción</h1>
        <div class="subtitle">«duras verdades que necesitas escuchar»</div>

        <button class="btn-panda" id="btnRevelar">
            ¿quieres oír tu verdad?
        </button>

        <!-- CAJA DE LA VERDAD -->
        <div class="truth-box" id="truthBox">
            <p class="placeholder">haz clic y enfréntate a ella...</p>
        </div>

        <div class="counter" id="counterDisplay">
            veces que has buscado la verdad: <strong id="countNumber">0</strong>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // --- LISTA DE VERDADES (AMPLIADA A 25) ---
            const verdades = [
                // Originales
                "Claro, ganar mucho dinero te hace sentir bien, pero eso no hará que tus hijos te quieran.",
                "Si te tienes que preguntar si confías en tu esposa, entonces probablemente no confías en ella.",
                "Lo que tú consideras 'amistad' son en realidad tus constantes intentos de impresionar a la gente.",
                "No estás ansioso por el éxito, estás ansioso por la aprobación de los demás.",
                "Pasas más tiempo proyectando quién quieres ser que conociendo quién eres realmente.",
                "Tu miedo al fracaso es más fuerte que tu deseo de mejorar, y por eso no avanzas.",
                "La mayoría de tus problemas no existen; son distracciones que creaste para no enfrentar el vacío.",
                "No eres especial. Y eso está bien. Dejar de intentar serlo te hará libre.",
                "Si necesitas publicarlo en redes, probablemente no lo estás disfrutando de verdad.",
                "Tu 'autenticidad' es solo otra máscara que usas para que te acepten.",
                "Sufres porque esperas que el mundo sea justo, y el mundo no te debe nada.",
                "Le tienes miedo a la soledad, pero le tienes más miedo a enfrentarte a ti mismo.",

                // Nuevas: trabajo y éxito
                "Tu trabajo no te define, pero tú has hecho que así sea porque no tienes otra cosa.",
                "No quieres un ascenso, quieres que tus padres por fin te digan que están orgullosos.",
                "Trabajas horas extra para evitar ir a casa, no por compromiso.",
                "Tu 'pasión' es solo una excusa para no admitir que no sabes qué hacer con tu vida.",

                // Nuevas: relaciones
                "Sigues con tu pareja por miedo a estar solo, no porque la ames.",
                "Discutes por tonterías porque es más fácil que hablar de lo que realmente te duele.",
                "No extrañas a esa persona, extrañas cómo te hacía sentir cuando estabas vacío.",
                "Perdonas porque necesitas que te perdonen, no porque hayas sanado.",

                // Nuevas: hábitos
                "Dices que no tienes tiempo, pero pasas 3 horas al día en el teléfono.",
                "El problema no es que no sepas qué hacer, es que sabes perfectamente qué hacer y no lo haces.",
                "No es procrastinación, es miedo a descubrir que no eres tan bueno como crees."
            ];

            // --- ELEMENTOS DEL DOM ---
            const btn = document.getElementById('btnRevelar');
            const truthBox = document.getElementById('truthBox');
            const countSpan = document.getElementById('countNumber');
            const counterDiv = document.getElementById('counterDisplay');

            let contador = 0;
            let escribiendo = false;
            let timeoutActual = null; // para poder cancelar la escritura si es necesario

            // --- OBTENER VERDAD ALEATORIA ---
            function getVerdadAleatoria() {
                return verdades[Math.floor(Math.random() * verdades.length)];
            }

            // --- EFECTO MÁQUINA DE ESCRIBIR ---
            function escribirVerdad(texto) {
                // Si ya está escribiendo, no hacemos nada
                if (escribiendo) return;

                // Cancelar cualquier timeout pendiente
                if (timeoutActual) {
                    clearTimeout(timeoutActual);
                    timeoutActual = null;
                }

                escribiendo = true;

                // Vaciamos la caja y creamos el párrafo
                truthBox.innerHTML = '';
                const parrafo = document.createElement('p');
                truthBox.appendChild(parrafo);

                // Añadimos clase visual de "escritura"
                truthBox.classList.add('writing');

                let indice = 0;
                const velocidad = 60; // milisegundos por letra
                // Número más bajo = más rápido, más alto = más lento

                // --- Función recursiva que escribe letra por letra ---
                function typeLetter() {
                    if (indice < texto.length) {
                        // Añadimos la siguiente letra
                        parrafo.textContent += texto.charAt(indice);
                        indice++;
                        // Programamos la siguiente letra
                        timeoutActual = setTimeout(typeLetter, velocidad);
                    } else {
                        // --- Terminó de escribir ---
                        truthBox.classList.remove('writing');
                        escribiendo = false;
                        timeoutActual = null;

                        // Añadimos un cursor parpadeante al final (opcional)
                        // Si quieres quitarlo, elimina estas 3 líneas
                        const cursor = document.createElement('span');
                        cursor.className = 'cursor-blink';
                        parrafo.appendChild(cursor);
                    }
                }

                // Iniciamos la escritura
                typeLetter();
            }

            // --- MOSTRAR VERDAD (función principal) ---
            function mostrarVerdad() {
                // Si está escribiendo, ignoramos el clic
                if (escribiendo) return;

                // Incrementar contador
                contador++;
                countSpan.textContent = contador;

                // Cambiar texto del botón según el número de clics
                if (contador === 1) {
                    btn.textContent = '¿otra verdad?';
                } else if (contador === 5) {
                    btn.textContent = '¿seguro que quieres seguir?';
                } else if (contador === 10) {
                    btn.textContent = 'eres masoquista, ¿no?';
                } else if (contador === 15) {
                    btn.textContent = 'ya no hay cura para ti';
                }

                // Estilo del contador si pasamos de 5
                if (contador > 5) {
                    counterDiv.classList.add('high');
                }

                // Elegir verdad y escribirla
                const verdadElegida = getVerdadAleatoria();
                escribirVerdad(verdadElegida);
            }

            // --- EVENTO DEL BOTÓN ---
            btn.addEventListener('click', mostrarVerdad);

        })();
    </script>

</body>
</html>
